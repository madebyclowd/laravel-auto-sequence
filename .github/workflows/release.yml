name: create-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Generate SBOM
        run: |
          composer config allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer require --dev cyclonedx/cyclonedx-php-composer --no-interaction --with-all-dependencies
          composer CycloneDX:make-sbom --output-format=JSON --output-file=bom.json --omit=dev

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: bom.json
